[test]
root = "."
coverage = true
coverageDir = "coverage"
coverageReporter = ["text", "lcov"]
coverageThreshold = { line = 0.8, statement = 0.8, function = 0.8 }
pathIgnorePatterns = ["docs/**", "**/__mocks__/**"]
coveragePathIgnorePatterns = [
  "docs/**",
  "**/__mocks__/**",
  "tests/**",
  "**/*.test.*",
  "**/*.spec.*",
  "src/**/*.tsx"
]

[test.reporter]
junit = "junit.xml"
