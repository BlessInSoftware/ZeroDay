name: CD

on:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  build:
    name: Build Docker Image
    permissions:
      contents: read
    uses: ./.github/workflows/docker-build.yml

  publish:
    name: Publish Docker Image
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
