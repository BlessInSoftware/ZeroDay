name: Publish Docker Image

on:
  workflow_call:

jobs:
  publish-ghcr:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📦 Download image
        uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp

      - name: 📦 Download tags
        uses: actions/download-artifact@v4
        with:
          name: tags
          path: /tmp

      - name: 📥 Load image
        run: docker load --input /tmp/image.tar

      - name: 🔐 Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Push image
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker push "$tag"
          done < /tmp/tags.txt
